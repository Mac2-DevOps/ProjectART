services:
  app:
    build: .
    command: ["255530"]
    depends_on:
      db:
        condition: service_healthy

  db:
    build: ./db
    environment:
      MYSQL_ROOT_PASSWORD: example
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pexample" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5m