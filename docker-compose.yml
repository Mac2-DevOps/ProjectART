services:
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy

  db:
    build: ./db
    ports:
      - "33060:3306"
    environment:
      MYSQL_ROOT_PASSWORD: example
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pexample"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s