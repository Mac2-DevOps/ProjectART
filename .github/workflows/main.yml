name: Build and Test ProjectArt

on: [push, pull_request]

jobs:
  UnitTests:
    name: Run Unit Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests
        run: mvn -B -Dtest=com.napier.sem.AppTest test

  IntegrationTests:
    name: Run Integration Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Start MySQL database
        run: docker compose up --build -d db

      - name: Wait for MySQL to become healthy
        run: |
          docker compose exec -T db mysql -uroot -pexample -D employees -e "SELECT emp_no, first_name, last_name FROM employees WHERE emp_no = 10001;"

      - name: Run Integration Tests
        run: mvn -B verify

      - name: Stop Docker Compose
        if: always()
        run: docker compose down

  Build:
    name: Package Application
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Package Application
        run: mvn -B package -DskipTests