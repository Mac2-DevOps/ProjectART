  name: Build and Test ProjectArt

  on: [push, pull_request]

  jobs:
    UnitTests:
      name: Run Unit Tests
      runs-on: ubuntu-22.04

      steps:
        - name: Checkout code
          uses: actions/checkout@v5
          with:
            submodules: recursive

        - name: Set up JDK 17
          uses: actions/setup-java@v5
          with:
            java-version: '17'
            distribution: 'temurin'
            cache: maven

        - name: Run Unit Tests
          run: mvn -B -Dtest=com.napier.sem.AppTest test

    IntegrationTests:
      name: Run Integration Tests
      runs-on: ubuntu-22.04

      steps:
        - name: Checkout code
          uses: actions/checkout@v5
          with:
            submodules: recursive

        - name: Set up JDK 17
          uses: actions/setup-java@v5
          with:
            java-version: '17'
            distribution: 'temurin'
            cache: maven

        - name: Start MySQL database
          run: docker compose up --build -d db

        - name: Wait for MySQL TCP readiness
          shell: bash
          run: |
            for i in {1..60}; do
              if python3 -c "import socket; s = socket.create_connection(('127.0.0.1', 33061), timeout=2); s.settimeout(2); data = s.recv(128); s.close(); exit(0 if data else 1)" 2>/dev/null; then
                echo "MySQL is accepting TCP connections"
                exit 0
              fi
              echo "Waiting for MySQL TCP readiness ($i/60)..."
              sleep 5
            done
            docker compose logs db
            echo "MySQL did not become TCP-ready in time"
            exit 1

        - name: Check MySQL container and employee data
          run: |
            docker compose ps
            docker compose port db 3306
            docker compose exec -T db mysql -uroot -pexample -D employees -e "SELECT emp_no, first_name, last_name FROM employees WHERE emp_no = 10001;"
            timeout 5 bash -c '</dev/tcp/127.0.0.1/33061' && echo "Host port is reachable" || (echo "Host port is NOT reachable" && exit 1)

        - name: Test MySQL connection from runner
          run: |
            python3 - <<'PY'
            import socket
            for host in ("127.0.0.1", "localhost"):
                print(f"Testing MySQL handshake via {host}:33061")
                try:
                    with socket.create_connection((host, 33061), timeout=5) as conn:
                        conn.settimeout(5)
                        greeting = conn.recv(128)
                        print(f"Received {len(greeting)} bytes from MySQL")
                        print(f"Handshake begins with: {greeting[:20].hex()}")
                except Exception as error:
                    print(f"Connection failed: {error}")
            PY

        - name: Run Integration Tests
          run: mvn -B verify

        - name: Show database logs
          if: always()
          run: docker compose logs db

        - name: Stop Docker Compose
          if: always()
          run: docker compose down

    Build:
      name: Package and Release Application
      runs-on: ubuntu-22.04
      permissions:
        contents: write

      steps:
        - name: Checkout code
          uses: actions/checkout@v5
          with:
            submodules: recursive

        - name: Set up JDK 17
          uses: actions/setup-java@v5
          with:
            java-version: '17'
            distribution: 'temurin'
            cache: maven

        - name: Package Application
          run: mvn -B package -DskipTests

        - name: Publish GitHub Release
          uses: softprops/action-gh-release@v2
          with:
            tag_name: v${{ github.run_number }}
            name: Release v${{ github.run_number }}
            body: Automated release created by GitHub Actions.
            files: target/ProjectArt-1.1.0.jar