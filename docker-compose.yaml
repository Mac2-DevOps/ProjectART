version: '3'
services:
  app:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
  db:
    build: db/.
    ports:
      - "3306:3306"
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
